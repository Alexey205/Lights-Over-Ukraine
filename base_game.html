<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Lights Over Ukraine</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/game-styles.css" />
    <link rel="icon" href="src/icon.png" type="image/png">
</head>

<body>
    <div id="map"></div>

    <!-- Toast контейнер -->
    <div id="toast-container"></div>

    <div id="mainPanel" class="panel collapsed">
        <div class="panel-tabs">
            <div class="tab active" data-tab="upgrades">⚙️ Покращення</div>
            <div class="tab" data-tab="status">ℹ️ Статус</div>
            <div class="tab" data-tab="events">📋 Події</div>
        </div>

        <div class="panel-content active" id="upgradesContent">
            <div class="resource-panel">
                <div class="resource-icon">⚡</div>
                <div class="resource-values">
                    <div class="resource-amount"><span id="energyResources">0</span> МВт·год</div>
                    <div class="income-rate">+<span id="incomeRate">0</span> МВт/хв</div>
                </div>
            </div>
            <button class="upgrade-btn" onclick="buyUpgrade('team')">
                <div class="upgrade-header">
                    <span class="upgrade-icon">👷</span>
                    <span class="upgrade-title">+1 Бригада</span>
                    <span class="upgrade-cost">100 МВт·год</span>
                </div>
                <div class="upgrade-effect">+50 МВт витрат</div>
            </button>

            <button class="upgrade-btn" onclick="buyUpgrade('powerPlant')">
                <div class="upgrade-header">
                    <span class="upgrade-icon">🏭</span>
                    <span class="upgrade-title">Покращити станцію</span>
                    <span class="upgrade-cost">300 МВт·год</span>
                </div>
                <div class="upgrade-effect">+200 МВт потужності</div>
            </button>

            <button class="upgrade-btn" onclick="buyLineUpgrade()" id="lineUpgradeBtn">
                <div class="upgrade-header">
                    <span class="upgrade-icon">🔌</span>
                    <span class="upgrade-title">Покращити лінії</span>
                    <span class="upgrade-cost" id="lineUpgradeCost">200 МВт·год</span>
                </div>
                <div class="upgrade-effect" id="lineUpgradeEffect">Рівень 1/3</div>
            </button>

            <button class="upgrade-btn" onclick="buyAutoRepair()" id="autoRepairBtn">
                <div class="upgrade-header">
                    <span class="upgrade-icon">🤖</span>
                    <span class="upgrade-title">Автоматичний ремонт</span>
                    <span class="upgrade-cost">800 МВт·год</span>
                </div>
                <div class="upgrade-effect">Швидкість ремонту +50%</div>
            </button>
        </div>

        <div class="panel-content" id="statusContent">
            <!-- Сюди буде динамічно додаватися статус -->
        </div>

        <div class="panel-content" id="eventsContent">
            <div class="event-filters">
                <div class="event-filter active" data-filter="all">Всі</div>
                <div class="event-filter" data-filter="attack">Атаки</div>
                <div class="event-filter" data-filter="repair">Ремонт</div>
                <div class="event-filter" data-filter="upgrade">Апгрейди</div>
                <div class="event-filter" data-filter="achievement">Досягнення</div>
            </div>
            <div class="events-history" id="events-history">
                <div class="events-count">Історія подій завантажується...</div>
            </div>
        </div>
    </div>

    <div id="togglePanel" class="panel-toggle">⚙️</div>

    <div id="lives-container">
        <span class="life">❤️</span>
        <span class="life">❤️</span>
        <span class="life">❤️</span>
    </div>

    <div id="game-time-container">
        <div id="game-time-label">Час гри:</div>
        <div id="game-time">0:00</div>
    </div>

    <div id="victory-progress">
        <div class="stage-header">🔌 Етап 1: Початкове відновлення</div>
        <div class="stage-description">Підключіть усі міста до мережі</div>
        <div class="victory-progress-bar">
            <div class="victory-progress-fill"></div>
        </div>
        <div class="stage-timer">Час: 5:00</div>
    </div>

    <div id="game-over">
        <h2>Гру завершено!</h2>
        <p>Ви витратили всі життя</p>
        <button id="restart-button">Грати знову</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/game-data.js"></script>
    <script src="js/game-core.js"></script>
    <script src="js/game-ui.js"></script>
    <script src="js/game-effects.js"></script>
    <script src="js/game-init.js"></script>
</body>

</html>
